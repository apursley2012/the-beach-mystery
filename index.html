<html lang="en">

        <meta

            content="#faf9f7" />
        <meta

            content="strict-origin-when-cross-origin" />

        <meta
            property="og:type"
            content="website" />
        <meta
            property="og:title"
            content="The Beach Mystery — An Interactive Adventure" />

            property="og:description"
            content="Play an illustrated choose-your-own-adventure with personalized story paths, hidden treasure, a riddle, seven routes, and four endings." />
        <meta
            property="og:url"
            content="https://apursley2012.github.io/the-beach-mystery/" />

        <meta
            property="og:image:height"
            content="630" />

            name="twitter:card"
            content="summary_large_image" />

            name="twitter:title"

        <meta
            name="twitter:description"
            content="Play an illustrated choose-your-own-adventure with personalized story paths, hidden treasure, a riddle, seven routes, and four endings." />

            name="twitter:image"
            content="https://apursley2012.github.io/the-beach-mystery/assets/icons/social-preview.png" />

            href="https://apursley2012.github.io/the-beach-mystery/" />

        <link
            rel="icon"
            href="./favicon.ico"
            sizes="any" />
        <link
            rel="icon"

            href="./assets/icons/icon-32.png" />

        <link
            rel="stylesheet"
            href="./styles/shared.css" />
        <link
            rel="stylesheet"
            href="./styles/pages/HomePage.css" />

            src="./js/main.js"></script>

        <noscript>
            <main class="noscript-message">
                <h1>The Beach Mystery</h1>

            </main>
        </noscript>
